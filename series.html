        /**
         * 💡 多副檔名自動候補函數 (解決 .webp / .jpg / .png 的相容問題)
         * @param {HTMLImageElement} imgElement - <img> 標籤元素
         * @param {string} basePath - 不帶副檔名的基本路徑
         */
        function handleImageError(imgElement, basePath) {
            const extensions = ['.webp', '.jpg', '.png', '.jpeg'];
            let currentTryIdx = parseInt(imgElement.getAttribute('data-try-idx') || '0');

            if (currentTryIdx < extensions.length) {
                const nextSrc = basePath + extensions[currentTryIdx];
                imgElement.setAttribute('data-try-idx', currentTryIdx + 1);
                imgElement.src = nextSrc;
            } else {
                imgElement.src = 'UATier0/image.png'; 
                imgElement.removeAttribute('data-try-idx');
                imgElement.onerror = null; 
            }
        }

        // 渲染系列卡片至網格
        function initSeriesGrid() {
            const grid = document.getElementById('series-grid');
            let gridHTML = '';
            
            allSeriesList.forEach((series) => {
                // 💡 修正：主畫面代表縮圖去除 "UA_" 前綴，直接讀取 `IP/系列名稱.webp`
                const seriesCleanName = series.folder.replace(/^UA_/, ''); 
                const basePath = `IP/${seriesCleanName}`; 
                
                gridHTML += `
                    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-md flex flex-col items-center">
                        <img src="${basePath}.webp" 
                             alt="${series.name}" 
                             class="series-img mb-3 cursor-pointer" 
                             data-try-idx="0"
                             onclick="toggleDetails(this, '${series.id}')" 
                             onerror="handleImageError(this, '${basePath}')">
                        <span class="font-bold text-gray-700 text-center text-sm sm:text-base">${series.name}</span>
                    </div>
                `;
            });
            grid.innerHTML = gridHTML;
        }

        // 初始化渲染
        initSeriesGrid();

        let activePanelId = null;

        /**
         * 點擊展開面板函數
         */
        function toggleDetails(element, seriesId) {
            const grid = document.getElementById('series-grid');
            
            // 1. 清除所有選取樣式
            document.querySelectorAll('.series-img').forEach(img => {
                img.classList.remove('selected');
            });

            // 2. 移除當前已打開的詳細面板
            const existingPanel = document.getElementById('active-detail-panel');
            if (existingPanel) {
                existingPanel.remove();
            }

            // 【收回邏輯】如果重複點擊同一個系列，就直接收合
            if (activePanelId === seriesId) {
                activePanelId = null;
                return;
            }

            // 3. 更新當前狀態
            element.classList.add('selected');
            activePanelId = seriesId;

            // 4. 取得該系列的資料
            const data = allSeriesList.find(item => item.id === seriesId);
            if (!data) return;

            // 5. 動態建立展開面板
            const panel = document.createElement('div');
            panel.id = 'active-detail-panel';
            panel.className = 'detail-panel'; 
            panel.style.display = 'block';

            const deckImages = data.images || [];
            // 預設第一張大展示圖路徑 (all_decks/系列名稱/1.webp)
            const defaultMainPath = deckImages.length > 0 ? `all_decks/${data.folder}/${deckImages[0]}` : '';

            // 6. 生成縮圖網格 (利用 series_thumbs/系列名稱/數字.webp)
            let thumbGridHTML = '';
            deckImages.forEach((imgNum) => {
                const thumbPath = `series_thumbs/${data.folder}/${imgNum}`;
                const deckFullPath = `all_decks/${data.folder}/${imgNum}`;

                thumbGridHTML += `
                    <div class="flex flex-col items-center">
                        <img src="${thumbPath}.webp" 
                             class="w-full aspect-[3/4] object-contain border border-gray-200 hover:border-red-500 rounded-lg shadow-sm cursor-pointer transition-all duration-200 p-1 bg-gray-50" 
                             alt="${data.name} 縮圖 ${imgNum}" 
                             data-try-idx="0"
                             onclick="switchMainImage('${deckFullPath}')"
                             onerror="handleImageError(this, '${thumbPath}')">
                    </div>
                `;
            });

            // 7. 組裝面板
            panel.innerHTML = `
                <div class="flex justify-between items-start mb-6 border-b border-gray-100 pb-4">
                    <div>
                        <h3 class="text-xl font-bold text-red-600 mb-1">${data.name} 系列卡組推薦</h3>
                        <p class="text-sm text-gray-600">${data.desc}</p>
                    </div>
                    <button onclick="closeDetails()" class="text-gray-400 hover:text-red-500 text-lg p-1 transition-colors">
                        <i class="fa-solid fa-xmark"></i> 關閉
                    </button>
                </div>

                <!-- 【上方區域】多欄縮圖區 (內部改用 series_thumbs/資料夾/數字) -->
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-4 max-w-4xl mx-auto mb-4">
                    ${thumbGridHTML}
                </div>

                <!-- 【下方區域】大圖展示 (內部改用 all_decks/資料夾/數字) -->
                <div class="flex flex-col items-center pt-3">
                    <span class="text-[10px] text-gray-400 mb-1 tracking-wider uppercase font-semibold">當前展示卡組</span>
                    <div class="bg-gray-50 p-2.5 rounded-2xl border border-gray-150 shadow-inner max-w-[300px] w-full">
                        <img id="main-deck-display" 
                             src="${defaultMainPath}.webp" 
                             class="w-full aspect-[3/4] object-contain rounded-xl shadow-md" 
                             alt="當前卡組展示"
                             data-try-idx="0"
                             onerror="handleImageError(this, '${defaultMainPath}')">
                    </div>
                </div>
            `;

            // 8. RWD 排版計算插入位置
            const items = Array.from(grid.children);
            const clickedIndex = items.indexOf(element.parentElement);
            
            let columns = 2; // 手機版
            if (window.innerWidth >= 768) {
                columns = 4; // 電腦
            } else if (window.innerWidth >= 640) {
                columns = 3; // 平板
            }

            const targetRowEndIndex = Math.min(
                Math.ceil((clickedIndex + 1) / columns) * columns - 1, 
                items.length - 1
            );

            // 9. 將面板插入正確的 Row 後方
            grid.insertBefore(panel, items[targetRowEndIndex].nextSibling);

            // 10. 平滑滾動
            setTimeout(() => {
                panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        /**
         * 切換大圖
         */
        function switchMainImage(newBasePath) {
            const mainDisplay = document.getElementById('main-deck-display');
            if (mainDisplay) {
                mainDisplay.setAttribute('data-try-idx', '0');
                mainDisplay.src = newBasePath + '.webp';
                
                mainDisplay.onerror = function() {
                    handleImageError(this, newBasePath);
                };
           }
        }

        /**
         * 關閉面板
         */
        function closeDetails() {
            const existingPanel = document.getElementById('active-detail-panel');
            if (existingPanel) {
                existingPanel.remove(); 
            }
            document.querySelectorAll('.series-img').forEach(img => {
                img.classList.remove('selected');
            });
            activePanelId = null; 
        }

        /**
         * 監聽瀏覽器 RWD 調整
         */
        window.onresize = () => {
            if (activePanelId) {
                const activeImg = document.querySelector('.series-img.selected');
                if (activeImg) {
                    const currentId = activePanelId;
                    activePanelId = null; 
                    toggleDetails(activeImg, currentId);
                }
            }
        };
    </script>
